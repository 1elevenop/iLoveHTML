<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page unavailable</title>
<style>
  body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #1e2430; }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  a.retry { display: inline-block; margin-top: 1rem; padding: .7rem 1.4rem; border-radius: .5rem; background: #1e2430; color: #fff; font-size: 1rem; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Page unavailable</h1>
  <p>The page could not be loaded. Check your connection and try again.</p>
  <!-- Handled natively by the wrapper, so it works with JavaScript disabled. -->
  <a class="retry" href="https://appassets.androidplatform.net/html2apk/retry">Try again</a>
</main>
</body>
</html>
