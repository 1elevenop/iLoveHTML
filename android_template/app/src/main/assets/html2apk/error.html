<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page unavailable</title>
<style>
  body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #1e2430; }
  main { max-width: 22rem; padding: 1.5rem; text-align: center; }
  button { margin-top: 1rem; padding: .7rem 1.4rem; border: 0; border-radius: .5rem; background: #1e2430; color: #fff; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Page unavailable</h1>
  <p>The page could not be loaded. Check your connection and try again.</p>
  <button onclick="history.back()">Try again</button>
</main>
</body>
</html>
