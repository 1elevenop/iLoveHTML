name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Dart core
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/html2apk_core
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    name: Flutter app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter analyze
      # Tests that need the prebuilt Windows wrapper or the Windows SDK skip themselves.
      - run: flutter test

  engine:
    name: Android engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The three committed gradle-wrapper.jar files must be Gradle's own.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # android_engine compiles with a Java 25 toolchain (jvmToolchain(25)).
          java-version: 25
      # The engine tests edit the real base APK and App Bundle, which are
      # built from android_template with the runner's default JDK (17).
      - name: Build the base APK and App Bundle
        working-directory: android_template
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          .\gradlew.bat assembleRelease bundleRelease --no-daemon --console=plain -q
      - run: .\gradlew.bat test --no-daemon --console=plain
        working-directory: android_engine

  android-app:
    name: Android app (APK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      # The app embeds the base APK (not in Git), so build it first, as
      # README "Run the Android app" does. This also catches dependency
      # bumps that need a newer compileSdk (see PR #16).
      - name: Build the base APK and App Bundle
        run: .\tools\build_ondevice_base.ps1
      - name: Build the app's debug APK
        working-directory: app
        run: flutter build apk --debug
