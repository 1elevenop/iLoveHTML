name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Known vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads every pubspec.lock (and Gradle lockfiles, should any be added).
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  core:
    name: Dart core
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/html2apk_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    name: Flutter app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter analyze
      # Tests that need the prebuilt Windows wrapper or the Windows SDK skip themselves.
      - run: flutter test

  engine:
    name: Android engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The three committed gradle-wrapper.jar files must be Gradle's own.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # android_engine compiles with a Java 25 toolchain (jvmToolchain(25)).
          java-version: 25
      # The engine tests edit the real base APK and App Bundle, which are
      # built from android_template with the runner's default JDK (17).
      - name: Build the base APK and App Bundle
        working-directory: android_template
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          .\gradlew.bat assembleRelease bundleRelease --no-daemon --console=plain -q
      - run: .\gradlew.bat test --no-daemon --console=plain
        working-directory: android_engine

  android-app:
    name: Android app (APK)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      # The app embeds the base APK (not in Git), so build it first, as
      # README "Run the Android app" does. This also catches dependency
      # bumps that need a newer compileSdk (see PR #16).
      - name: Build the base APK and App Bundle
        run: .\tools\build_ondevice_base.ps1
      - name: Build the app's debug APK
        working-directory: app
        run: flutter build apk --debug
