name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Dart core
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/html2apk_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  app:
    name: Flutter app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter analyze
      # Tests that need the prebuilt Windows wrapper or the Windows SDK skip themselves.
      - run: flutter test

  engine:
    name: Android engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The three committed gradle-wrapper.jar files must be Gradle's own.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: .\gradlew.bat test --no-daemon --console=plain
        working-directory: android_engine
