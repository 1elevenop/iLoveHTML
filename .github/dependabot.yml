version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /packages/html2apk_core
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directories:
      - /android_template
      - /android_engine
      - /android_ondevice_prototype
      - /app/android
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
