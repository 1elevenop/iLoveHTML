version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    groups:
      app-pub:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /packages/html2apk_core
    schedule:
      interval: weekly
    groups:
      core-pub:
        patterns: ["*"]
  # One weekly PR for all four Gradle projects. Toolchain bumps here must
  # follow ADR 0003: rebuild the base APK and run the on-device test first.
  - package-ecosystem: gradle
    directories:
      - /android_template
      - /android_engine
      - /android_ondevice_prototype
      - /app/android
    schedule:
      interval: weekly
    groups:
      android-toolchain:
        patterns: ["*"]
    # androidx.core 1.19+ needs compileSdk 37; the projects pin 36 (ADR 0003).
    # Remove this when moving to compileSdk 37. See PRs #16 and #21.
    ignore:
      - dependency-name: "androidx.core:*"
        versions: [">= 1.18.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
