name: html2apk_app
description: "iLoveHTML: turn a website into an Android or Windows app."
publish_to: 'none'
version: 1.2.3+10

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.8
  ffi: ^2.2.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  html2apk_core:
    path: ../packages/html2apk_core
  intl: any
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  archive: ^4.5.2
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
