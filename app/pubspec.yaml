name: html2apk_app
description: "iLoveHTML: turn a website into an Android or Windows app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  ffi: ^2.2.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  html2apk_core:
    path: ../packages/html2apk_core
  path: ^1.9.1
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  archive: ^4.5.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
